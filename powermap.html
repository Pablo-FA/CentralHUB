<!doctype html>
<html lang="es" data-style="cristal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="build-stamp" content="2026-10-17 17:59" data-file="powermap"/>
<title>Powermap · Sales tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --bg:#fff;--ink:#000;--ink2:rgba(0,0,0,.64);--ink3:rgba(0,0,0,.42);
  --line:rgba(0,0,0,.12);--line2:rgba(0,0,0,.24);--zone:rgba(255,255,255,.82);--soft:rgba(0,0,0,.04);
  --wash-a:#ffffff;--wash-b:#eef0f4;--zone-a:rgba(255,255,255,.88);--zone-b:rgba(249,250,252,.72);--g1:#ffffff;--g2:#eceff4;
  --cold:#4f7df0;--warm:#d99a22;--hot:#e0523b;--danger:#d23b2a;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000;--ink:#fff;--ink2:rgba(255,255,255,.68);--ink3:rgba(255,255,255,.44);
  --line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.28);--zone:rgba(0,0,0,.76);--soft:rgba(255,255,255,.07);
  --wash-a:#0e1013;--wash-b:#000000;--zone-a:rgba(24,26,31,.84);--zone-b:rgba(6,7,9,.76);--g1:#252830;--g2:#121418;
  --cold:#6f95ff;--warm:#e8b04a;--hot:#ff6a52;--danger:#ff6a52;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.t-cold{--c:var(--cold)}.t-warm{--c:var(--warm)}.t-hot{--c:var(--hot)}

/* barra superior */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;color:var(--ink2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button:not(.on):hover{color:var(--ink)}

/* globo y escenario */
.stage{position:relative;display:flex;min-height:100vh;overflow:hidden;background:radial-gradient(120% 95% at 50% 38%,var(--wash-a) 0%,var(--wash-b) 100%)}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg));pointer-events:none;z-index:0}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#map.grabbing{cursor:grabbing}
#map.hit{cursor:pointer}
.overlay{position:relative;z-index:1;width:100%;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:72px clamp(24px,5.5vw,128px) 60px;pointer-events:none}
.quad,.acc,.blank{pointer-events:auto}
.mapnote{position:absolute;z-index:2;right:24px;bottom:20px;color:var(--ink3);font-size:12px}
.legend{position:absolute;z-index:2;left:24px;bottom:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--zone);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--line2));flex:none}
.ptag{flex:none;font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:1px 9px;color:var(--ink2);white-space:nowrap}
.ptag.dec{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* zonas alrededor del globo */
.quads{--pw:clamp(360px,27vw,480px);--sw:clamp(420px,calc(100vh*.8),1100px);flex:1;width:100%;display:grid;grid-template-columns:var(--pw) minmax(0,var(--sw));grid-template-rows:1fr;grid-template-areas:"panel globe";gap:clamp(24px,3.2vw,64px);align-items:center;justify-content:center}
.panel{grid-area:panel;background:linear-gradient(180deg,var(--zone-a),var(--zone-b));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:4px 18px 18px;pointer-events:auto}
.panel{container-type:inline-size;min-width:0}
.ptabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:0 -6px 14px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:1 1 auto;min-width:0;display:inline-flex;justify-content:center;align-items:baseline;gap:5px;padding:13px clamp(4px,2.2cqw,12px) 10px;color:var(--ink2);font-size:clamp(11.5px,3.7cqw,13px);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
@container (max-width:318px){.ptab small{display:none}}
.ptab small{color:var(--ink3);font-size:11px}
.ptab:hover{color:var(--ink)}
.ptab.on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.phead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;min-height:26px;margin-bottom:10px;color:var(--ink3);font-size:12px}
.panel .list{min-height:340px;align-content:start}
.globeslot{grid-area:globe;align-self:stretch;min-height:380px;position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:2px 0}
.gtop{display:flex;flex-direction:column;align-items:center;gap:8px}
.ghint{font-size:12px;color:var(--ink2);text-align:center;background:var(--zone);border-radius:999px;padding:3px 12px;pointer-events:none}
.gctl{display:flex;gap:6px;pointer-events:auto}
.gbtn{border:1px solid var(--line2);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink2);background:var(--zone)}
.gbtn:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.gbtn:disabled{opacity:.4;cursor:default}
.zoom{width:290px;pointer-events:auto;background:var(--zone);border:1px solid var(--line);border-radius:12px;padding:8px 16px 4px}
.zoom:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ztrack{position:relative;height:22px;cursor:pointer;touch-action:none}
.ztrack::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--line2)}
.zfill{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:var(--ink)}
.ztick{position:absolute;top:7px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink)}
.zthumb{position:absolute;top:2px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ink)}
.zlabels{display:grid;grid-template-columns:1fr 1fr 1fr;margin:2px -10px 0;font-size:12px}
.zlabels button{color:var(--ink2);padding:2px 0;white-space:nowrap}
.zlabels button:nth-child(1){text-align:left}
.zlabels button:nth-child(2){text-align:center}
.zlabels button:nth-child(3){text-align:right}
.zlabels button.on{color:var(--ink);font-weight:500}
.zlabels button:hover{color:var(--ink)}
.invisible{visibility:hidden}
.gbot{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.zwrap{position:relative;display:flex;justify-content:center;width:100%}
.zwrap #recenter{position:absolute;left:calc(50% + 156px);top:50%;transform:translateY(-50%);pointer-events:auto}
.kids{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;pointer-events:auto}
.kid{border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:12px;background:var(--zone);color:var(--ink2)}
.kid:hover{border-color:var(--ink);color:var(--ink)}
.kid.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quads.fade{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:7px 11px;font-size:12px;line-height:1.35;max-width:230px}
.tip b{display:block;font-weight:500;font-size:13px}
.tip span{display:block;color:var(--ink2)}
.q-industries{grid-area:ind}.q-services{grid-area:svc}.q-leadership{grid-area:lead}.q-misc{grid-area:misc}
.quad{background:linear-gradient(180deg,var(--zone-a),var(--zone-b));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:16px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;min-height:26px}
.qhead h3{font-size:15px;font-weight:500}
.qhead h3 small{color:var(--ink3);font-weight:400;font-size:13px;margin-left:6px}
.add{width:26px;height:26px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;color:var(--ink2);font-size:16px;line-height:1}
.add:hover{border-color:var(--ink);color:var(--ink)}
.list{display:grid;grid-template-columns:1fr;gap:8px}
.empty{color:var(--ink3);font-size:13px;padding:6px 2px}

/* fichas de persona y de grupo */
.pill{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;min-width:0;transition:opacity .15s,border-color .15s}
.pill:hover{border-color:var(--ink)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:500;border:2px solid var(--c,var(--line2));flex:none}
.ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid var(--line2);background:linear-gradient(160deg,var(--g1),var(--g2));color:var(--ink)}
.ico svg{display:block}
.ico.big{width:44px;height:44px}
.pill .t{min-width:0;flex:1;display:block}
.pill .n{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pill .h{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;font-size:12px;line-height:1.3;color:var(--ink2)}
.pill .h .dot{width:7px;height:7px;margin-right:4px}
.pill .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.own,.cnt{width:22px;height:22px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;font-size:10px;color:var(--ink2);flex:none}
.own.none{border-style:dashed;color:var(--ink3)}
.cnt{font-size:11px}
.due{font-size:11px;color:var(--ink3);white-space:nowrap}
.due.late{color:var(--danger);font-weight:500}
.due.today{color:var(--ink)}
.pill.ghost{border-style:dashed;color:var(--ink3);background:transparent}
.pill.ghost .av,.pill.ghost .ico{border-style:dashed;border-color:var(--line2);font-size:15px;background:transparent;color:var(--ink3)}
.overlay.hovering .pill:not(.echo){opacity:.4}
.pill.echo{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

/* cuentas */
.segs{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.segs i{height:4px;border-radius:2px;background:var(--line2)}
.segs i.on{background:var(--ink)}

/* dashboard */
.dash{max-width:1480px;margin:0 auto;padding:64px clamp(16px,2.4vw,52px) 110px}
.dash h2{font-size:22px;font-weight:500;letter-spacing:-.01em}
.dash .lead{color:var(--ink2);margin:4px 0 28px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:20px 16px 20px 0}
.kpi+.kpi{padding-left:20px;border-left:1px solid var(--line)}
.kpi b{display:block;font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.kpi span{color:var(--ink2);font-size:13px}
.kpi.warn b{color:var(--danger)}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;margin-top:52px}
.cols h3{font-size:16px;font-weight:500;margin-bottom:4px}
.cols .sub{color:var(--ink2);font-size:13px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th{font-weight:400;color:var(--ink3);font-size:12px;text-align:left;padding:0 8px 8px 0}
td{padding:12px 8px 12px 0;border-top:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
td.who{font-weight:500}
td.late{color:var(--danger);font-weight:500}
.meter{display:flex;align-items:center;gap:10px}
.meter .bar2{flex:1;height:5px;border-radius:3px;background:var(--line2);overflow:hidden;min-width:60px}
.meter .bar2 i{display:block;height:100%;background:var(--ink)}
.meter span{width:38px;text-align:right;color:var(--ink2);font-size:12px}
.offrow{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.34);padding:24px}
[data-theme="dark"] .modal{background:rgba(0,0,0,.62)}
.modal[hidden]{display:none}
.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:linear-gradient(180deg,var(--bg),var(--bg));border:1px solid var(--line2);border-radius:18px;padding:28px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.mh h2{font-size:25px;font-weight:500;letter-spacing:-.015em;display:flex;align-items:center;gap:12px}
.mh .sb{color:var(--ink2);margin-top:6px}
.mh .sb span+span{margin-left:14px}
.x{width:32px;height:32px;border:1px solid var(--line2);border-radius:50%;font-size:18px;line-height:1;display:grid;place-items:center;flex:none;text-align:center}
.x:hover{border-color:var(--ink)}
.back{color:var(--ink2);margin-bottom:12px;display:inline-block}
.back:hover{color:var(--ink)}
.sec{margin-top:26px}
.sec h4{font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:10px;display:flex;justify-content:space-between;gap:12px}
.sec h4 em{font-style:normal;font-weight:400;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--ink2)}
.chip.link:hover{border-color:var(--ink);color:var(--ink)}
.ogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.otile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:66px;padding:10px 12px;border-radius:10px;border:1px solid var(--ink)}
.otile .o-n{font-weight:500}
.otile .o-s{font-size:12px}
.otile.proj{background:var(--ink);color:var(--bg)}
.otile.proj .o-s{opacity:.75}
.otile.told{background:transparent}
.otile.told .o-s{color:var(--ink2)}
.otile.none{border:1px dashed var(--line2);color:var(--ink3)}
button.otile.none:hover,button.otile.told:hover{border-color:var(--ink)}
.hint{color:var(--ink3);font-size:12px;margin-top:8px}
.row3{display:grid;grid-template-columns:1fr 160px 160px;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
label.f{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:130px}
.proj-row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 0;border-top:1px solid var(--line)}
.proj-row .pn{font-weight:500}
.proj-row .pm{color:var(--ink2);font-size:12px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.st.risk{color:var(--danger)}
.st.risk::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--danger)}
.pbar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ink)}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:16px;padding-left:18px;border-left:1px solid var(--line2)}
.tree li{position:relative;padding:4px 0}
.tree ul li::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:1px solid var(--line2)}
.node{display:inline-flex;align-items:center;gap:10px;padding:6px 8px 6px 7px;border:1px solid var(--line);border-radius:999px;max-width:100%}
.node:hover{border-color:var(--ink)}
.node .av{width:28px;height:28px;font-size:10px}
.node .nt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.node .nt b{font-weight:500}
.node .nt small{color:var(--ink2);font-size:12px}
.node .own{width:20px;height:20px;font-size:9px}
.node .due{margin-right:4px}
.foot{margin-top:28px;color:var(--ink3);font-size:12px}
.err{color:var(--danger);font-size:12px;margin-top:6px;min-height:16px}
.btn{background:var(--ink);color:var(--bg);border-radius:9px;padding:10px 18px;font-weight:500}
.btn:hover{opacity:.88}
.btn2{border:1px solid var(--line2);border-radius:9px;padding:9px 16px;color:var(--ink)}
.btn2:hover{border-color:var(--ink)}
.btn.sm,.btn2.sm{padding:7px 14px;font-size:13px}
.padds{display:flex;gap:6px;flex-wrap:wrap}
.padds .btn2.sm{padding:5px 11px;font-size:12px}
.addoff{margin-top:12px}
.addoff-row{display:flex;gap:8px;align-items:center}
.addoff-row input{flex:1}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

@media (max-width:1040px){
  .quads{grid-template-columns:1fr;grid-template-rows:auto auto;grid-template-areas:"panel" "globe";align-items:start;gap:16px}
  .panel .list{min-height:0}
  .globeslot{min-height:0;padding:0}
  .gtop{display:none}
  #map{pointer-events:none;cursor:default}
  .overlay{padding:24px 16px 96px;justify-content:flex-start}
}
@media (max-width:760px){
  .cols,.row2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){padding-left:0;border-left:0}
  .ogrid{grid-template-columns:repeat(2,1fr)}
  .row3{grid-template-columns:1fr}
  .overlay{padding:24px 16px 96px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.quads.fade{animation:none}}
/* =====================================================================
   ESTILO CRISTAL
   Claro: azul sereno, poco saturado. Oscuro: azul noche con acento turquesa.
   Todo el color sale de las variables de abajo.
   ===================================================================== */
[data-style="cristal"]{--font:"Plus Jakarta Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--font-display:var(--font)}
[data-style="cristal"][data-theme="light"]{
  --bg:#f3f6fa;--ink:#14202e;--ink2:rgba(20,32,46,.76);--ink3:rgba(20,32,46,.66);
  --line:rgba(70,100,150,.14);--line2:rgba(70,100,150,.28);
  --zone:rgba(255,255,255,.86);--soft:rgba(70,100,150,.07);
  --wash-a:#f9fbfd;--wash-b:#e5ecf5;--zone-a:rgba(255,255,255,.82);--zone-b:rgba(255,255,255,.7);
  --g1:#ffffff;--g2:#e4ecf8;--danger:#c4314b;
  --accent:#4a67b3;--accent-fg:#ffffff;--on-grad:#ffffff;
  --grad:linear-gradient(135deg,#4a67b3 0%,#357a99 100%);
  --sh:60,90,150;--glass-b:rgba(255,255,255,.78);--glass-hi:rgba(255,255,255,.9);--card-bg:rgba(255,255,255,.82);--tab-on:#ffffff}
[data-style="cristal"][data-theme="dark"]{
  --bg:#07101b;--ink:#eaf6ff;--ink2:rgba(234,246,255,.78);--ink3:rgba(234,246,255,.54);
  --line:rgba(130,190,215,.16);--line2:rgba(130,190,215,.3);
  --zone:rgba(12,28,46,.8);--soft:rgba(130,190,215,.08);
  --wash-a:#0f2338;--wash-b:#050b14;--zone-a:rgba(14,32,52,.74);--zone-b:rgba(8,20,34,.68);
  --g1:#1d4560;--g2:#0d2436;--danger:#ff7d92;
  --accent:#5cc3b8;--accent-fg:#04141a;--on-grad:#04141a;
  --grad:linear-gradient(135deg,#5cc3b8 0%,#5ba6dc 100%);
  --sh:0,0,0;--glass-b:rgba(255,255,255,.1);--glass-hi:rgba(255,255,255,.08);--card-bg:rgba(255,255,255,.055);--tab-on:rgba(255,255,255,.1)}

function blankScope(sc){

/* ---------- cálculos ---------- */
var DEFS=function(cat){return cat==='industries'?INDUSTRIES:SERVICES};
function eachPlacement(sc,fn){
  sc.place.leadership.forEach(function(x){fn(x,'leadership',null)});
  sc.place.misc.forEach(function(x){fn(x,'misc',null)});
  ['industries','services'].forEach(function(cat){
    DEFS(cat).forEach(function(d){(sc.place[cat][d.id]||[]).forEach(function(x){fn(x,cat,d)})});
  });
}
function countCat(sc,cat){if(cat==='accounts')return accountsOf(sc).length;var n=0;eachPlacement(sc,function(x,q){if(q===cat)n++});return n}
/* Cuentas de un ámbito: en región y global suman las de sus mercados */
function accountsOf(sc){
  var out=[];
  var add=function(s){(s.accounts||[]).forEach(function(aid){out.push({aid:aid,market:s.level==='market'?s.id:null})})};
  add(sc);
  if(sc.level==='region')marketsOf(sc.id).forEach(function(k){add(MARKETS[k])});
  if(sc.level==='global')Object.keys(MARKETS).forEach(function(k){add(MARKETS[k])});
  return out;
}
function scopeIds(sc){
  var set={};
  var add=function(s){
    eachPlacement(s,function(x){set[x[0]]=1});
    (s.accounts||[]).forEach(function(a){ACC[a].team.forEach(function(t){set[t.p]=1})});
  };
  add(sc);
  if(sc.level==='region')marketsOf(sc.id).forEach(function(k){add(MARKETS[k])});
  if(sc.level==='global'){
    Object.keys(REGIONS).forEach(function(k){add(REGIONS[k])});
    Object.keys(MARKETS).forEach(function(k){add(MARKETS[k])});
  }
  return Object.keys(set);
}
function accountTold(a){
  var out={};
  a.team.forEach(function(t){
    var told=P[t.p].told;
    Object.keys(told).forEach(function(o){if(!(o in out)||told[o]<out[o])out[o]=told[o]});
  });
  return out;
}
function appearances(pid){
  var out=[];
  ALL_SCOPES().forEach(function(sc){
    eachPlacement(sc,function(x,q,d){
      if(x[0]!==pid)return;
      out.push({label:d?x[1]+' · '+d.short+' ('+sc.name+')':x[1]+' ('+sc.name+')'});
    });
    (sc.accounts||[]).forEach(function(aid){ACC[aid].team.forEach(function(t){if(t.p===pid)out.push({label:t.role+' de '+ACC[aid].name,aid:aid})})});
  });
  return out;
}
function groupInfo(gkey){
  var a=gkey.split(':'),cat=a[0],id=a[1];
  var def=DEFS(cat).filter(function(x){return x.id===id})[0];
  return {cat:cat,id:id,def:def,list:curScope().place[cat][id]||[]};
}
function leadOf(list){return list.filter(function(x){return !x[2]})[0]||list[0]}
function isLate(p){return p.next.date&&diffDays(p.next.date)<0}
function stats(sc){
  var ps=scopeIds(sc).map(function(i){return P[i]});
  var cells=ps.length*OFFS.length;
  var told=ps.reduce(function(n,p){return n+Object.keys(p.told).length},0);
  var isWeek=function(p){var d=diffDays(p.next.date);return p.next.date&&d>=0&&d<=7};
  var byOwner=OWNERS.concat(['']).map(function(o){
    var mine=ps.filter(function(p){return p.owner===o});
    var t=mine.reduce(function(n,p){return n+Object.keys(p.told).length},0);
    return {o:o,n:mine.length,cov:mine.length?t/(mine.length*OFFS.length):0,late:mine.filter(isLate).length,week:mine.filter(isWeek).length};
  });
  var byOff=OFFS.map(function(o){
    return {o:o,pct:ps.length?ps.filter(function(p){return o.id in p.told}).length/ps.length:0};
  }).sort(function(a,b){return a.pct-b.pct});
  return {n:ps.length,cov:cells?told/cells:0,late:ps.filter(isLate).length,noOwner:ps.filter(function(p){return !p.owner}).length,byOwner:byOwner,byOff:byOff};
}
function regionLeadName(r){
  var x=null;
  [GLOBAL.place.leadership,r.place.leadership].forEach(function(l){if(!x)x=l.filter(function(y){return y[1]===r.needHat&&P[y[0]]})[0]});
  return x?P[x[0]].name:null;
}
function leadName(sc){
  if(sc.level==='region')return regionLeadName(sc);
  if(sc.level==='market'){var x=sc.place.leadership.filter(function(y){return y[1]==='Market PoC'})[0];return x?P[x[0]].name:null}
  return null;
}

function dueHTML(p){
  if(!p.next.date)return '';
  var dd=diffDays(p.next.date);
  return dd<0?'<span class="due late">hace '+(-dd)+' d</span>':dd===0?'<span class="due today">hoy</span>':'<span class="due">en '+dd+' d</span>';
}
function ownHTML(p){

}
function pill(pid,hat){

function tile(cat,d,sc){
  var list=sc.place[cat][d.id]||[],lead=leadOf(list),lp=lead?P[lead[0]]:null;
  var late=list.filter(function(x){return isLate(P[x[0]])}).length;

  var right=list.length?'<span class="r"><span class="cnt" title="'+list.length+(list.length===1?' persona':' personas')+'">'+list.length+'</span>'+(late?'<span class="due late">'+late+(late===1?' vencido':' vencidos')+'</span>':'')+'</span>':'';
  return '<button class="pill tile'+(list.length?'':' ghost')+'" data-action="group" data-g="'+cat+':'+d.id+'" title="'+esc(d.name)+'">'+
    '<span class="ico">'+icon(d.icon,18)+'</span><span class="t"><span class="n">'+esc(d.short)+'</span>'+sub+'</span>'+right+'</button>';

/* ---------- logotipos de las cuentas ----------
   Salen de la web de la cuenta. Sin clave se usa el favicon de Google (pequeño).
   Con un Client ID gratuito de Brandfetch (developers.brandfetch.com) salen logos de mejor calidad. */
var LOGO_CLIENT_ID='';
function cleanDomain(raw){
  var s=String(raw||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];
  return /^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(s)?s:'';
}
function logoUrl(web){
  if(!web)return '';
  var d=encodeURIComponent(web);
  return LOGO_CLIENT_ID?'https://cdn.brandfetch.io/'+d+'?c='+encodeURIComponent(LOGO_CLIENT_ID):'https://www.google.com/s2/favicons?domain='+d+'&sz=128';
}
function logoHTML(a,cls){
  var u=logoUrl(a.web),ini=esc((a.name||'?').trim().charAt(0).toUpperCase());
  return '<span class="lg '+(cls||'')+'">'+(u?'<img src="'+esc(u)+'" alt="" loading="lazy" referrerpolicy="no-referrer" data-m="'+ini+'">':'<span class="lg-m">'+ini+'</span>')+'</span>';
}
/* si el logo no carga, se muestra la inicial */
document.addEventListener('error',function(e){
  var t=e.target;
  if(t&&t.tagName==='IMG'&&t.parentNode&&t.parentNode.classList&&t.parentNode.classList.contains('lg')){
    var m=document.createElement('span');m.className='lg-m';m.textContent=t.getAttribute('data-m')||'?';
    t.parentNode.replaceChild(m,t);
  }
},true);

function panelHTML(sc){
  var key=S.tab,items,plus='',note;

    return '<button class="ptab'+(on?' on':'')+'" role="tab" id="tab-'+t[0]+'" aria-selected="'+on+'" tabindex="'+(on?0:-1)+'" data-action="tab" data-t="'+t[0]+'">'+t[1]+'<small>'+countCat(sc,t[0])+'</small></button>';
  }).join('');

    var list=accountsOf(sc);
    items=list.length?list.map(acctRow).join(''):'<p class="empty">Todavía no hay cuentas en '+esc(sc.level==='market'?marketLabel(sc):sc.name)+'. Crea la primera con «+ Cuenta».</p>';

    plus='<div class="padds"><button class="btn2 sm" data-action="newacc" aria-label="Nueva cuenta">+ Cuenta</button></div>';
  }else if(key==='industries'||key==='services'){
    items=DEFS(key).map(function(d){return tile(key,d,sc)}).join('');
    note=key==='industries'?'Pulsa una industria para ver su power map.':'Pulsa un servicio para ver su power map.';

    '<div class="phead"><span>'+note+'</span>'+plus+'</div>'+
    '<div class="list" role="tabpanel" aria-labelledby="tab-'+key+'">'+items+'</div></aside>';
}
function renderStage(){

function getPattern(pal,dpr){
  var key=pal.id+'@'+dpr;
  if(PATS[key]!==undefined)return PATS[key];
  var t=pal.mode==='hatch'?6:7,tc=document.createElement('canvas');
  tc.width=tc.height=Math.round(t*dpr);
  var x=tc.getContext('2d');x.scale(dpr,dpr);
  if(pal.mode==='hatch'){
    x.strokeStyle=pal.patC;x.lineWidth=pal.patW||.8;x.lineCap='square';x.beginPath();
    x.moveTo(0,t);x.lineTo(t,0);x.moveTo(-1,1);x.lineTo(1,-1);x.moveTo(t-1,t+1);x.lineTo(t+1,t-1);x.stroke();
  }else{
    x.fillStyle=pal.patC;var r=pal.patR||1.05;
    [[t*.25,t*.25],[t*.75,t*.75]].forEach(function(p){x.beginPath();x.arc(p[0],p[1],r,0,Math.PI*2);x.fill()});
  }
  var pat=ctx.createPattern(tc,'repeat');
  if(pat&&pat.setTransform&&window.DOMMatrix)pat.setTransform(new DOMMatrix([1/dpr,0,0,1/dpr,0,0]));
  PATS[key]=pat;return pat;
}
function themeName(){return document.documentElement.dataset.theme==='dark'?'dark':'light'}

/* clasificación de países */
function regionOf(f){
  var n=f.properties.name;
  if(n==='Russia'||n==='Turkey')return 'emea';
  var lon=f._c[0],lat=f._c[1];
  if(lon>=-170&&lon<-30)return 'americas';
  if(lon>=-30&&lon<=62)return 'emea';
  return 'apac';
}
function eachCoord(g,fn){
  if(!g)return;
  if(g.type==='Polygon')g.coordinates.forEach(function(r){r.forEach(fn)});
  else if(g.type==='MultiPolygon')g.coordinates.forEach(function(p){p.forEach(function(r){r.forEach(fn)})});
}
function prep(feats){
  var out=[];
  feats.forEach(function(f){
    if(f.properties.name==='Antarctica'||!f.geometry)return;
    f._c=d3.geoCentroid(f);f._b=d3.geoBounds(f);
    var r=0;eachCoord(f.geometry,function(p){var d=d3.geoDistance(f._c,p);if(d>r)r=d});
    f._r=r;f._region=regionOf(f);
    f._market=NAME2MKT[f.properties.name]||((f._region==='emea'&&f._c[1]<36&&!MEA_EXCLUDE[f.properties.name])?'mea':null);
    out.push(f);
  });
  return out;
}

/* cámara */
function sizeCanvas(){
  var st=$('#stage'),W=st.clientWidth,H=st.clientHeight,dpr=Math.min(window.devicePixelRatio||1,2);
  var pw=Math.round(W*dpr),ph=Math.round(H*dpr);
  if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph}
  GL.W=W;GL.H=H;GL.dpr=dpr;
}
function camFor(sc,Rv){
  var cam=sc.cam,span=Math.min(cam.span*1.2,90);
  return {rot:[-cam.center[0],-cam.center[1],0],R:span>=90?Rv:Rv/Math.sin(span*Math.PI/180)};
}
function measureTarget(){
  sizeCanvas();
  var sr=$('#stage').getBoundingClientRect(),slot=$('#globeSlot'),cx,cy,Rv;
  if(slot&&slot.offsetWidth>200&&window.innerWidth>1040){
    var b=slot.getBoundingClientRect(),gt=$('.gtop',slot),gb=$('.gbot',slot);
    var top=gt?gt.getBoundingClientRect().bottom:b.top,bottom=gb?gb.getBoundingClientRect().top:b.bottom;
    var availH=Math.max(160,bottom-top-12);
    cx=b.left-sr.left+b.width/2;cy=(top+bottom)/2-sr.top;
    Rv=Math.min(availH/2,b.width*.66);
  }else{
    cx=GL.W/2;cy=GL.H/2;Rv=Math.min(GL.W,GL.H)*.4;
  }
  var cf=camFor(curScope(),Rv);
  return {rot:cf.rot,R:cf.R,Rv:Rv,cx:cx,cy:cy};
}
function dataset(){return(W50&&(S.level!=='global'||GL.R>GL.Rv*1.6))?W50:W110}
function visible(list){
  var cen=[-GL.rot[0],-GL.rot[1]];
  var dmax=Math.hypot(Math.max(GL.cx,GL.W-GL.cx),Math.max(GL.cy,GL.H-GL.cy));
  var alpha=dmax>=GL.R?Math.PI/2:Math.asin(dmax/GL.R);
  return list.filter(function(f){return d3.geoDistance(f._c,cen)-f._r<alpha+.03});
}
function catOf(f){
  var hv=GL.hover;
  if(S.level==='global')return(hv&&hv.kind==='region'&&f._region===hv.id)?2:0;
  if(S.level==='region'){
    if(hv&&hv.kind==='market'&&f._market===hv.id)return 2;
    return(f._market&&MARKETS[f._market].region===S.region)?1:0;
  }
  if(f._market===S.market)return 3;
  if(hv&&hv.kind==='market'&&f._market===hv.id)return 2;
  return(f._market&&MARKETS[f._market].region===S.region)?1:0;
}
function labelPoints(){
  if(S.level==='global')return Object.keys(REGIONS).map(function(k){return {n:REGIONS[k].name,c:REGIONS[k].cam.center}});
  var ks=marketsOf(S.region);
  if(S.level==='market')ks=[S.market].concat(ks.filter(function(k){return k!==S.market}));
  return ks.map(function(k){return {n:MARKETS[k].name,c:MARKETS[k].cam.center}});
}
function drawGlobe(){
  if(!GL.ready||!W110)return;
  var c=ctx,pal=palNow(),W=GL.W,H=GL.H,R=GL.R,cx=GL.cx,cy=GL.cy;
  var gR=Math.min(R,Math.max(W,H)*.6);
  c.setTransform(GL.dpr,0,0,GL.dpr,0,0);
  c.clearRect(0,0,W,H);
  var proj=d3.geoOrthographic().rotate(GL.rot).scale(R).translate([cx,cy]).clipAngle(90).precision(.8);
  var path=d3.geoPath(proj,c);
  var feats=visible(dataset());
  GL.proj=proj;GL.list=feats;
  if(pal.haloA&&R<Math.max(W,H)){
    var hr=pal.haloR||1.3,g=c.createRadialGradient(cx,cy,R*.97,cx,cy,R*hr);
    g.addColorStop(0,pal.haloA);g.addColorStop(1,pal.haloB);
    c.fillStyle=g;c.beginPath();c.arc(cx,cy,R*hr,0,Math.PI*2);c.fill();
  }
  var sg=c.createRadialGradient(cx-gR*.38,cy-gR*.42,gR*.05,cx,cy,gR*1.02);
  sg.addColorStop(0,pal.sA);sg.addColorStop(1,pal.sB);
  c.beginPath();path({type:'Sphere'});c.fillStyle=sg;c.fill();
  c.save();
  c.beginPath();path({type:'Sphere'});c.clip();
  c.beginPath();path(GRAT);c.strokeStyle=pal.grat;c.lineWidth=.6;c.stroke();
  var base=[],mid=[],hot=[],cur=[];
  feats.forEach(function(f){var k=catOf(f);(k===3?cur:k===2?hot:k===1?mid:base).push(f)});
  if(pal.mode==='hatch'||pal.mode==='dots'){
    /* tierra con trama (grabado o puntos) y resaltes translúcidos encima */
    c.beginPath();feats.forEach(function(f){path(f)});
    c.fillStyle=pal.landBase;c.fill();
    var pat=getPattern(pal,GL.dpr);
    if(pat){c.fillStyle=pat;c.fill()}
    c.strokeStyle=pal.lS;c.lineWidth=pal.lW||.7;c.stroke();
    if(mid.length){c.beginPath();mid.forEach(function(f){path(f)});c.fillStyle=pal.tMid;c.fill();c.strokeStyle=pal.mdS;c.lineWidth=.9;c.stroke()}
    if(cur.length){c.beginPath();cur.forEach(function(f){path(f)});c.fillStyle=pal.tCur;c.fill();c.strokeStyle=pal.hS;c.lineWidth=1.6;c.stroke()}
    if(hot.length){
      c.beginPath();hot.forEach(function(f){path(f)});
      c.save();c.shadowColor=pal.hGlow;c.shadowBlur=18;c.fillStyle=pal.tHot;c.fill();c.restore();
      c.strokeStyle=pal.hS;c.lineWidth=1.4;c.stroke();
    }
  }else{
    var lg=c.createLinearGradient(cx-gR,cy-gR,cx+gR*.6,cy+gR);
    lg.addColorStop(0,pal.lA);lg.addColorStop(1,pal.lB);
    c.beginPath();base.forEach(function(f){path(f)});
    c.fillStyle=lg;c.fill();c.strokeStyle=pal.lS;c.lineWidth=.7;c.stroke();
    if(mid.length){
      var mg=c.createLinearGradient(cx-gR,cy-gR,cx+gR*.6,cy+gR);
      mg.addColorStop(0,pal.mdA);mg.addColorStop(1,pal.mdB);
      c.beginPath();mid.forEach(function(f){path(f)});
      c.fillStyle=mg;c.fill();c.strokeStyle=pal.mdS;c.lineWidth=.8;c.stroke();
    }
    if(cur.length){
      var cg=c.createLinearGradient(cx-gR*.5,cy-gR*.5,cx+gR*.5,cy+gR*.5);
      cg.addColorStop(0,pal.cA);cg.addColorStop(1,pal.cB);
      c.beginPath();cur.forEach(function(f){path(f)});
      c.fillStyle=cg;c.fill();c.strokeStyle=pal.hS;c.lineWidth=1.6;c.stroke();
    }
    if(hot.length){
      var hg=c.createLinearGradient(cx-gR*.5,cy-gR*.5,cx+gR*.5,cy+gR*.5);
      hg.addColorStop(0,pal.hA);hg.addColorStop(1,pal.hB);
      c.beginPath();hot.forEach(function(f){path(f)});
      c.save();c.shadowColor=pal.hGlow;c.shadowBlur=16;c.fillStyle=hg;c.fill();c.restore();
      c.strokeStyle=pal.hS;c.lineWidth=1;c.stroke();
    }
  }
  var sh=c.createRadialGradient(cx-gR*.3,cy-gR*.35,gR*.25,cx,cy,gR*1.02);
  sh.addColorStop(0,pal.shade0);sh.addColorStop(1,pal.shade);
  c.fillStyle=sh;c.fillRect(0,0,W,H);
  c.restore();
  if(R<Math.max(W,H)*1.5){c.beginPath();path({type:'Sphere'});c.strokeStyle=pal.limb;c.lineWidth=pal.limbW||1;c.stroke()}
  var cen=[-GL.rot[0],-GL.rot[1]];
  var up=pal.labelCase==='upper';
  c.font=(up?'600 11px ':'500 12px ')+(getComputedStyle(document.body).fontFamily||'sans-serif');
  if('letterSpacing' in c)c.letterSpacing=up?'1px':'0px';
  c.textBaseline='middle';c.lineJoin='round';
  var placed=[];
  var hit=function(r){return placed.some(function(q){return r.x<q.x+q.w+3&&r.x+r.w+3>q.x&&r.y<q.y+q.h+2&&r.y+r.h+2>q.y})};
  labelPoints().forEach(function(lp){
    if(d3.geoDistance(lp.c,cen)>Math.PI/2-.05)return;
    var pt=proj(lp.c);if(!pt)return;
    if(Math.hypot(pt[0]-cx,pt[1]-cy)>GL.Rv*1.02)return;
    var txt=up?lp.n.toUpperCase():lp.n;
    var w=c.measureText(txt).width,h=14,x=pt[0],y=pt[1];
    var cands=[[x+9,y,'left'],[x-9-w,y,'left'],[x-w/2,y-13,'left'],[x-w/2,y+13,'left']];
    var pick=null;
    for(var i=0;i<cands.length&&!pick;i++){
      var r={x:cands[i][0],y:cands[i][1]-h/2,w:w,h:h};
      if(!hit(r)){pick=cands[i];placed.push(r)}
    }
    c.fillStyle=pal.label;c.beginPath();c.arc(x,y,3,0,Math.PI*2);c.fill();
    if(!pick)return;
    c.textAlign='left';
    c.lineWidth=3;c.strokeStyle=pal.labelHalo;c.strokeText(txt,pick[0],pick[1]);
    c.fillStyle=pal.label;c.fillText(txt,pick[0],pick[1]);
  });
}
function scheduleDraw(){
  if(drawQueued)return;
  drawQueued=true;
  requestAnimationFrame(function(){drawQueued=false;drawGlobe()});
}
function stopAnim(){if(anim){anim.stop();anim=null}}
var lerp=function(a,b,t){return a+(b-a)*t};
function flyTo(tgt,animate){
  if(!W110)return;
  GL.tgt=tgt;
  if(anim){if(!animate)return;stopAnim()}
  if(!GL.ready||!animate||reduceMotion){
    GL.rot=tgt.rot.slice();GL.R=tgt.R;GL.Rv=tgt.Rv;GL.cx=tgt.cx;GL.cy=tgt.cy;GL.ready=true;drawGlobe();return;
  }
  var from={rot:GL.rot.slice(),R:GL.R,cx:GL.cx,cy:GL.cy};
  var lr0=Math.log(from.R);
  GL.Rv=tgt.Rv;
  var dist=d3.geoDistance([-from.rot[0],-from.rot[1]],[-tgt.rot[0],-tgt.rot[1]]);
  var ratio=Math.abs(Math.log(tgt.R/from.R));
  var arc=ratio<0.8?Math.min(0.9,dist*2.2):0;
  var dur=ratio>1?1200:Math.max(900,Math.round(750+dist*900));
  anim=d3.timer(function(el){
    var t=Math.min(1,el/dur),e=d3.easeCubicInOut(t),T=GL.tgt;
    var dl2=((T.rot[0]-from.rot[0]+540)%360)-180;
    GL.rot=[from.rot[0]+dl2*e,lerp(from.rot[1],T.rot[1],e),0];
    GL.R=Math.exp(lerp(lr0,Math.log(T.R),e)-arc*Math.sin(Math.PI*t));
    GL.cx=lerp(from.cx,T.cx,e);GL.cy=lerp(from.cy,T.cy,e);GL.Rv=T.Rv;
    drawGlobe();
    if(t>=1)stopAnim();
  });
}
function globeUpdate(animate){
  if(!W110)return;
  var tgt=measureTarget();
  if(animate)showRecenter(false);
  if(!GL.ready||!animate||reduceMotion)showRecenter(false);
  flyTo(tgt,animate);
}
function showRecenter(on){var b=$('#recenter');if(b)b.classList.toggle('invisible',!on)}

/* interacción: hover, click y arrastre */
function featureAt(ll){
  var list=GL.list||[],lon=ll[0],lat=ll[1];
  for(var i=0;i<list.length;i++){
    var f=list[i],b=f._b;
    if(lat<b[0][1]||lat>b[1][1])continue;
    var inLon=b[0][0]<=b[1][0]?(lon>=b[0][0]&&lon<=b[1][0]):(lon>=b[0][0]||lon<=b[1][0]);
    if(!inLon)continue;
    if(d3.geoContains(f,ll))return f;
  }
  return null;
}
function targetAt(clientX,clientY){
  if(!GL.proj)return null;
  var r=canvas.getBoundingClientRect(),x=clientX-r.left,y=clientY-r.top;
  GL.px=x;GL.py=y;
  var ll=GL.proj.invert([x,y]);
  if(!ll||isNaN(ll[0]))return null;
  var f=featureAt(ll);
  if(!f)return null;
  if(S.level==='global')return {kind:'region',id:f._region,country:f.properties.name};
  if(S.level==='region'){
    if(f._market&&MARKETS[f._market].region===S.region)return {kind:'market',id:f._market,country:f.properties.name};
    if(f._region===S.region)return {kind:'none',country:f.properties.name};
    return null;
  }
  if(f._market&&MARKETS[f._market].region===S.region)return {kind:'market',id:f._market,country:f.properties.name};
  if(f._region===S.region)return {kind:'none',country:f.properties.name};
  return null;
}
var tip=$('#tip');
function hideTip(){tip.hidden=true}
function tipHTML(t){
  if(t.kind==='region'){
    var r=REGIONS[t.id],ln=regionLeadName(r);
    return '<b>'+esc(r.name)+'</b><span>'+(ln?'Lead: '+esc(ln):'Lead por confirmar')+'</span>';
  }
  if(t.kind==='market'){
    var m=MARKETS[t.id],pn=leadName(m);
    return '<b>'+esc(marketLabel(m))+'</b>'+(m.full?'<span>'+esc(m.full)+'</span>':'')+'<span>'+(pn?'Market PoC: '+esc(pn):'Market PoC por confirmar')+'</span>';
  }
  if(S.level!=='global')return '<b>'+esc(t.country)+'</b><span>Sin mercado asignado todavía</span>';
  return '';
}
function moveTip(){
  if(tip.hidden)return;
  var st=$('#stage').getBoundingClientRect();
  var x=GL.px+16,y=GL.py+16;
  if(x+240>st.width)x=GL.px-240;
  tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';
}
function setHover(h){
  var a=GL.hover?GL.hover.kind+':'+GL.hover.id:'',b=h?h.kind+':'+h.id:'';
  GL.hover=(h&&h.kind!=='none')?h:null;
  if(a!==b){scheduleDraw()}
}
function onCanvasMove(e){
  var d=GL.drag;
  if(d){
    var dx=e.clientX-d.x,dy=e.clientY-d.y;
    if(!d.moved&&Math.hypot(dx,dy)>4){d.moved=true;stopAnim();canvas.classList.add('grabbing');hideTip()}
    if(d.moved){
      var k=57.2958/GL.R;
      GL.rot=[d.rot[0]+dx*k,clamp(d.rot[1]-dy*k,-90,90),0];
      GL.moved=true;showRecenter(true);scheduleDraw();
    }
    return;
  }
  var t=targetAt(e.clientX,e.clientY);
  setHover(t);
  var txt=t?tipHTML(t):'';
  if(txt){tip.innerHTML=txt;tip.hidden=false;moveTip()}else hideTip();

}
canvas.addEventListener('pointerdown',function(e){
  if(e.button!==0)return;
  try{canvas.setPointerCapture(e.pointerId)}catch(err){}
  GL.drag={x:e.clientX,y:e.clientY,rot:GL.rot.slice(),moved:false};
});
canvas.addEventListener('pointermove',onCanvasMove);
canvas.addEventListener('pointerup',function(e){
  var d=GL.drag;GL.drag=null;canvas.classList.remove('grabbing');
  if(d&&!d.moved){
    var t=targetAt(e.clientX,e.clientY);
    if(t&&t.kind==='region')navigate('region',t.id);

  }
});
canvas.addEventListener('pointercancel',function(){GL.drag=null;canvas.classList.remove('grabbing')});
canvas.addEventListener('pointerleave',function(){if(!GL.drag){setHover(null);hideTip();canvas.classList.remove('hit')}});


/* ---------- zoom: slider de tres paradas y Ctrl + rueda ---------- */
function nearestScope(list,ll){
  var best=null,bd=1e9;
  list.forEach(function(sc){var d=d3.geoDistance(sc.cam.center,ll);if(d<bd){bd=d;best=sc}});
  return best;
}
function pickRegion(ll){
  var f=featureAt(ll);
  if(f&&REGIONS[f._region])return REGIONS[f._region];
  return nearestScope(Object.keys(REGIONS).map(function(k){return REGIONS[k]}),ll);
}
function pickMarket(reg,ll){
  var f=featureAt(ll);
  if(f&&f._market&&MARKETS[f._market].region===reg.id)return MARKETS[f._market];
  return nearestScope(marketsOf(reg.id).map(function(k){return MARKETS[k]}),ll);
}
/* Al hacer zoom in se entra en lo que esté en el centro del globo */
function zoomPath(){
  var ll=[-GL.rot[0],-GL.rot[1]];
  var reg=S.level!=='global'?REGIONS[S.region]:pickRegion(ll);
  var mk=S.level==='market'?MARKETS[S.market]:pickMarket(reg,ll);
  return [GLOBAL,reg,mk];
}
function goToStop(k,path,cams){
  var L=levelIndex();
  if(k===L){
    if(cams)flyTo({rot:cams[L].rot,R:cams[L].R,Rv:GL.Rv,cx:GL.cx,cy:GL.cy},true);
    return;
  }
  if(k===0)navigate('global');
  else if(k===1)navigate('region',path[1].id);
  else navigate('market',path[2].id);
}
function zoomStep(dir){
  var k=clamp(levelIndex()+dir,0,2);
  if(k!==levelIndex())goToStop(k,zoomPath());
}
/* Cámara para una posición continua t (0 = global, 1 = región, 2 = mercado) */
function applyZoomT(t,cams){
  var i=t>=2?1:Math.floor(t),u=t>=2?1:t-i,a=cams[i],b=cams[i+1];
  var dl=((b.rot[0]-a.rot[0]+540)%360)-180;
  GL.rot=[a.rot[0]+dl*u,lerp(a.rot[1],b.rot[1],u),0];
  GL.R=Math.exp(lerp(Math.log(a.R),Math.log(b.R),u));
}
var Z=null;
function zoomT(e){var r=Z.tr.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width*2,0,2)}
function zoomSetThumb(t,tr){
  var p=(t*50)+'%',th=$('.zthumb',tr),fl=$('.zfill',tr);
  if(th)th.style.left=p;if(fl)fl.style.width=p;
}
function zoomMove(e){
  if(!Z)return;
  if(!Z.moved&&Math.abs(e.clientX-Z.x)<4)return;
  if(!Z.moved){Z.moved=true;var zl=$('#zlabels');if(zl)zl.innerHTML=zoomLabels(Z.path)}
  var t=zoomT(e);Z.t=t;zoomSetThumb(t,Z.tr);
  applyZoomT(t,Z.cams);
  hideTip();setHover(null);scheduleDraw();
}
function zoomUp(e){
  if(!Z)return;
  var z=Z;Z=null;
  var tr=z.tr;tr.removeEventListener('pointermove',zoomMove);tr.removeEventListener('pointerup',zoomUp);tr.removeEventListener('pointercancel',zoomUp);
  var r=tr.getBoundingClientRect();
  var k=Math.round(clamp((e.clientX-r.left)/r.width*2,0,2));
  if(!z.moved){goToStop(k,z.path);return}
  var L=levelIndex();
  if(k===L){
    zoomSetThumb(L,tr);
    var zl=$('#zlabels');if(zl)zl.innerHTML=zoomLabels(null);
    goToStop(k,z.path,z.cams);
  }else goToStop(k,z.path);
}
function zoomStart(e,tr){
  stopAnim();
  try{tr.setPointerCapture(e.pointerId)}catch(err){}
  var L=levelIndex(),path=zoomPath();
  var cams=path.map(function(sc,i){return i===L?{rot:GL.rot.slice(),R:GL.R}:camFor(sc,GL.Rv)});
  Z={tr:tr,L:L,path:path,cams:cams,t:L,moved:false,x:e.clientX};
  tr.addEventListener('pointermove',zoomMove);tr.addEventListener('pointerup',zoomUp);tr.addEventListener('pointercancel',zoomUp);
}

function loadMap(){
  var note=$('#mapnote');
  if(!window.d3||!window.topojson){mapState='fail';note.hidden=false;return}
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')
    .then(function(r){if(!r.ok)throw new Error('map');return r.json()})
    .then(function(topo){
      W110=prep(topojson.feature(topo,topo.objects.countries).features);
      GRAT=d3.geoGraticule10();
      mapState='ok';note.hidden=true;
      var tgt=measureTarget();
      GL.rot=[tgt.rot[0]+55,tgt.rot[1],0];GL.R=tgt.R*.92;GL.Rv=tgt.Rv;GL.cx=tgt.cx;GL.cy=tgt.cy;GL.ready=true;
      drawGlobe();

      setTimeout(loadDetail,500);
    })
    .catch(function(){mapState='fail';note.hidden=false});
}

    .then(function(topo){W50=prep(topojson.feature(topo,topo.objects.countries).features);scheduleDraw()})

function personImpact(pid){
  var roles=0,accs=[],cals=[],blocked=null;
  ALL_SCOPES().forEach(function(sc){eachPlacement(sc,function(x){if(x[0]===pid)roles++})});
  Object.keys(ACC).forEach(function(aid){
    var a=ACC[aid];
    if(a.team.some(function(t){return t.p===pid})){accs.push(a.name);if(a.team.length===1)blocked=a.name;if(a.cal===pid)cals.push(a.name)}
  });
  return {roles:roles,accounts:accs,cals:cals,blocked:blocked};
}
function deletePerson(pid){
  var imp=personImpact(pid);
  if(imp.blocked)return {error:true};
  ALL_SCOPES().forEach(function(sc){
    ['leadership','misc'].forEach(function(k){sc.place[k]=sc.place[k].filter(function(x){return x[0]!==pid})});
    ['industries','services'].forEach(function(cat){
      Object.keys(sc.place[cat]).forEach(function(gid){
        var list=sc.place[cat][gid],e=list.filter(function(x){return x[0]===pid})[0];
        if(!e)return;
        var parent=e[2]||null;
        list.forEach(function(f){if(f[2]===pid){if(parent)f[2]=parent;else f.length=2}});
        sc.place[cat][gid]=list.filter(function(x){return x[0]!==pid});
      });
    });
    if(sc.lead===pid)sc.lead=null;
  });
  Object.keys(ACC).forEach(function(aid){teamRemove(ACC[aid],pid)});
  delete P[pid];
  return {ok:true};
}

function teamKids(a,pid){return a.team.filter(function(t){return (t.under||null)===pid})}
function teamDesc(a,pid){
  var out={},st=[pid];
  while(st.length){var x=st.pop();teamKids(a,x).forEach(function(k){out[k.p]=1;st.push(k.p)})}
  return out;
}
function teamOrder(a){
  var out=[];
  (function walk(pid,d){teamKids(a,pid).forEach(function(t){out.push({t:t,d:d});walk(t.p,d+1)})})(null,0);
  return out;
}
function teamMakeCal(a,pid){
  if(a.cal===pid)return;
  var me=a.team.filter(function(t){return t.p===pid})[0],old=a.team.filter(function(t){return t.p===a.cal})[0];
  if(!me||!old)return;
  me.under=null;me.role='CAL';
  old.role='SAL';old.under=pid;
  a.cal=pid;
}
function teamRemove(a,pid){
  var me=a.team.filter(function(t){return t.p===pid})[0];
  if(!me)return {};
  var rest=a.team.filter(function(t){return t.p!==pid});
  if(!rest.length)return {error:'solo'};
  if(a.cal===pid){
    var nr=rest.filter(function(t){return t.under===pid})[0]||rest[0];
    rest.forEach(function(t){if(t.under===pid)t.under=nr.p});
    nr.under=null;nr.role='CAL';a.cal=nr.p;
  }else{
    rest.forEach(function(t){if(t.under===pid)t.under=me.under||a.cal});
  }
  a.team=rest;
  return {};
}
function teamAdd(a,name,role,under){
  var nm=String(name||'').trim().replace(/\s+/g,' ');
  if(!nm)return {error:'Escribe el nombre de la persona.'};

  if(rl.toLowerCase()==='cal')return {error:'Para cambiar el CAL usa «Hacer CAL» en la persona.'};
  var pid=null;
  Object.keys(P).forEach(function(k){if(P[k].name.toLowerCase()===nm.toLowerCase())pid=k});
  if(pid&&a.team.some(function(t){return t.p===pid}))return {error:'Esa persona ya está en el client team.'};
  if(!pid){pid=genId('p');person(pid,nm,'','operativo','cold',{},null)}
  a.team.push({p:pid,role:rl,under:under||a.cal});
  return {ok:true};
}

async function hubReq(method,path,body){

async function hubNotify(o,entry){
  if(!HUB_SYNC||!entry.mentions.length)return {sent:[],failed:[]};
  var sent=[],failed=[];
  var ex140=entry.t.length>140?entry.t.slice(0,139)+'…':entry.t;
  var log={ts:new Date().toISOString(),txt:entry.t,by:entry.a,mentions:entry.mentions};
  for(var i=0;i<entry.mentions.length;i++){
    var who=entry.mentions[i],tid='td_offering_'+o.id+'_'+hubSlug(who),text='Offering «'+o.name+'»: '+ex140;
    try{
      var g=await hubReq('GET','/todos?id=eq.'+encodeURIComponent(tid)),rows=await g.json();
      if(rows.length){
        var lg=Array.isArray(rows[0].log)?rows[0].log.slice():[];lg.push(log);
        await hubReq('PATCH','/todos?id=eq.'+encodeURIComponent(tid),{text:text,done:false,log:lg});
      }else{
        await hubReq('POST','/todos',{id:tid,owner:who,text:text,done:false,source:'offering',ref_id:'offering_'+o.id});
        try{await hubReq('PATCH','/todos?id=eq.'+encodeURIComponent(tid),{log:[log]})}catch(e2){}
      }
      await hubReq('POST','/notifications',{id:'nf_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),recipient:who,task_id:tid,author:entry.a,excerpt:ex140,read:false});
      sent.push(who);
    }catch(e){failed.push(who)}
  }
  return {sent:sent,failed:failed};
}

}

var wheelAcc=0,wheelLock=0,Pn=null;
var LN_STEP=Math.log(2.4);   /* cada nivel amplía ~2,4x: un pellizco de 2,4x equivale a un nivel */
function pinchBegin(){
  if(Pn)return;
  stopAnim();
  var L=levelIndex(),path=zoomPath();
  var cams=path.map(function(sc,i){return i===L?{rot:GL.rot.slice(),R:GL.R}:camFor(sc,GL.Rv)});
  Pn={L:L,path:path,cams:cams,t:L,t0:L,timer:0};
  var zl=$('#zlabels');if(zl)zl.innerHTML=zoomLabels(path);
  hideTip();setHover(null);
}
function pinchSet(t){
  Pn.t=t;
  var tr=$('#ztrack');if(tr)zoomSetThumb(t,tr);
  applyZoomT(t,Pn.cams);
  scheduleDraw();
}
function pinchEnd(){
  if(!Pn)return;
  var p=Pn;Pn=null;clearTimeout(p.timer);
  var d=p.t-p.L,n=Math.abs(d);
  var steps=n<0.35?0:Math.max(1,Math.round(n));
  var k=clamp(p.L+(d>=0?1:-1)*steps,0,2);
  if(k===p.L){
    var tr=$('#ztrack');if(tr)zoomSetThumb(p.L,tr);
    var zl=$('#zlabels');if(zl)zl.innerHTML=zoomLabels(null);
  }
  goToStop(k,p.path,p.cams);
}
canvas.addEventListener('wheel',function(e){
  if(!(e.ctrlKey||e.metaKey))return;
  e.preventDefault();
  var dy=e.deltaMode===1?e.deltaY*16:e.deltaY;
  var notch=Math.abs(dy)>=50&&Number.isInteger(dy);
  if(notch){
    /* rueda de ratón con Ctrl: un nivel por paso */
    var now=Date.now();
    if(now<wheelLock)return;
    wheelAcc+=dy;
    if(Math.abs(wheelAcc)>=40){zoomStep(wheelAcc<0?1:-1);wheelAcc=0;wheelLock=now+800}
    return;
  }
  /* pellizco del trackpad: zoom continuo que sigue a los dedos y encaja al soltar */
  pinchBegin();
  pinchSet(clamp(Pn.t-dy*0.01/LN_STEP,0,2));
  clearTimeout(Pn.timer);Pn.timer=setTimeout(pinchEnd,140);
},{passive:false});
/* Safari envía eventos gesture en lugar de Ctrl + rueda */
canvas.addEventListener('gesturestart',function(e){e.preventDefault();pinchBegin();Pn.t0=Pn.t});
canvas.addEventListener('gesturechange',function(e){
  e.preventDefault();
  if(!Pn)return;
  pinchSet(clamp(Pn.t0+Math.log(e.scale)/LN_STEP,0,2));
});
canvas.addEventListener('gestureend',function(e){e.preventDefault();pinchEnd()});

    });

function snapOf(R){var s={};PM_TABLES.forEach(function(t){s[t]={};Object.keys(R[t]).forEach(function(id){s[t][id]=JSON.stringify(R[t][id])})});return s}
function diffRows(cur){
  var up={},del={},n=0;
  PM_TABLES.forEach(function(t){
    var s=DB.snap[t]||{};up[t]=[];del[t]=[];
    Object.keys(cur[t]).forEach(function(id){if(s[id]!==JSON.stringify(cur[t][id]))up[t].push(id)});

async function fetchAll(t){

    if(!r.ok)throw new Error(t+' '+r.status);
    var a=await r.json();out=out.concat(a);
    if(a.length<1000)break;
    off+=1000;
  }
  return out;
}
function hydrate(T){
  wipeData();
  T.pm_offerings.slice().sort(byPos).forEach(function(r){
    OFFS.push({id:r.id,name:r.name,short:r.short||r.name,parent:r.parent_id||null,desc:r.description||'',owner:r.owner||'',sme:r.sme||'',status:r.status||'draft',links:[],comments:[]});
  });
  var oBy={};OFFS.forEach(function(o){oBy[o.id]=o});
  T.pm_offering_links.slice().sort(byPos).forEach(function(r){var o=oBy[r.offering_id];if(o)o.links.push({id:r.id,label:r.label||'',url:r.url})});
  T.pm_offering_comments.slice().sort(function(a,b){return a.created_at<b.created_at?1:-1}).forEach(function(r){
    var o=oBy[r.offering_id];if(!o)return;
    o.comments.push({id:r.id,a:r.author||'',d:iso(new Date(r.created_at)),ts:r.created_at,t:r.text,mentions:Array.isArray(r.mentions)?r.mentions:[]});
  });
  T.pm_people.forEach(function(r){
    P[r.id]={id:r.id,name:r.name,owner:r.owner||'',power:r.power||'operativo',temp:r.temp||'cold',told:{},next:{text:r.next_text||'',date:r.next_date||''}};
  });
  T.pm_told.forEach(function(r){var p=P[r.person_id];if(p&&oBy[r.offering_id])p.told[r.offering_id]=Math.max(0,-diffDays(r.told_on))});
  var scBy={};ALL_SCOPES().forEach(function(sc){scBy[sc.level+':'+sc.id]=sc});
  T.pm_placements.slice().sort(byPos).forEach(function(r){
    var sc=scBy[r.scope_level+':'+r.scope_id];if(!sc||!P[r.person_id])return;
    var e=[r.person_id,r.hat||''];if(r.parent_id&&P[r.parent_id])e.push(r.parent_id);
    if(r.category==='leadership'||r.category==='misc')sc.place[r.category].push(e);
    else if(sc.place[r.category]&&sc.place[r.category][r.group_id])sc.place[r.category][r.group_id].push(e);
  });
  var teamBy={},projBy={};
  T.pm_account_team.slice().sort(byPos).forEach(function(r){(teamBy[r.account_id]=teamBy[r.account_id]||[]).push(r)});
  T.pm_account_projects.slice().sort(byPos).forEach(function(r){(projBy[r.account_id]=projBy[r.account_id]||[]).push(r)});
  T.pm_accounts.slice().sort(byPos).forEach(function(r){
    var mk=MARKETS[r.market_id];if(!mk)return;
    var team=(teamBy[r.id]||[]).filter(function(t){return P[t.person_id]}).map(function(t){
      var q={p:t.person_id,role:t.role||''};if(t.under_id&&P[t.under_id])q.under=t.under_id;return q;
    });
    var cal=P[r.cal_id]?r.cal_id:(team[0]?team[0].p:null);
    if(!cal)return;
    if(!team.some(function(t){return t.p===cal}))team.unshift({p:cal,role:'CAL'});
    ACC[r.id]={name:r.name,web:r.web||'',cal:cal,team:team,
      projects:(projBy[r.id]||[]).map(function(q){return {id:q.id,name:q.name,off:q.offering_id||null,progress:q.progress||0,status:q.status||'ok'}})};
    mk.accounts.push(r.id);
  });
  if(!offById(S.cat.sel))S.cat.sel=OFFS.length?offTree()[0].id:null;
  DB.snap=snapOf(dbRows());
}
function backupLocal(T){
  try{
    var keys=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('pm_backup_')===0)keys.push(k)}
    keys.sort();
    var last=keys[keys.length-1];
    if(last&&Date.now()-(+last.slice(10))<30*60*1000)return;
    while(keys.length>=3)localStorage.removeItem(keys.shift());
    localStorage.setItem('pm_backup_'+Date.now(),JSON.stringify(T));
  }catch(e){}
}
window.pmBackups=function(){var o=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('pm_backup_')===0)o.push({clave:k,fecha:new Date(+k.slice(10)).toLocaleString()})}return o};
window.pmExport=function(){
  var blob=new Blob([JSON.stringify(dbRows(),null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='powermap-'+iso(TODAY)+'.json';a.click();
};
async function dbLoad(){
  try{
    var res=await Promise.all(PM_TABLES.map(fetchAll)),T={};
    PM_TABLES.forEach(function(t,i){T[t]=res[i]});
    hydrate(T);backupLocal(T);
    DB.loaded=true;DB.failed=false;DB.lastLoad=Date.now();
    setBanner(false);
    return true;
  }catch(e){
    console.warn('powermap: no se pudo cargar desde Supabase',e);
    if(!DB.loaded){DB.failed=true;setBanner(true)}
    return false;
  }
}
function setBanner(on){
  var el=$('#pmBanner');if(!el)return;
  el.hidden=!on;
  el.innerHTML=on?'<span>No se pudo conectar con Supabase. Powermap se muestra sin datos y los cambios no se guardarán hasta que vuelva la conexión.</span><button class="btn2 sm" data-action="dbretry">Reintentar</button>':'';
}
function setSync(state){
  var el=$('#pmSync');if(!el)return;
  clearTimeout(DB.syncT);
  if(!state){el.hidden=true;return}
  el.hidden=false;el.className='pmsync '+state;
  el.innerHTML=state==='saving'?'Guardando…':state==='saved'?'Guardado':'No se pudo guardar. Reintentando… <button data-action="dbretry">Reintentar</button>';
  if(state==='saved')DB.syncT=setTimeout(function(){el.hidden=true},1600);
}
async function hubWrite(method,path,body){
  var opts={method:method,headers:Object.assign({},HUB_H,{'Prefer':method==='POST'?'resolution=merge-duplicates,return=minimal':'return=minimal'}),cache:'no-store'};
  if(body){opts.body=JSON.stringify(body);if(opts.body.length<60000)opts.keepalive=true}
  var r=await fetch(HUB_URL+path,opts);
  if(!r.ok)throw new Error(method+' '+path+' '+r.status);
}
async function persist(){
  if(DEMO||!DB.loaded||DB.failed)return;
  if(DB.busy){DB.again=true;return}
  var cur=dbRows(),d=diffRows(cur);
  if(!d.n){return}
  DB.busy=true;DB.again=false;clearTimeout(DB.retry);setSync('saving');
  var ok=true;
  try{
    var now=new Date().toISOString(),by=myName();
    for(var i=0;i<PM_TABLES.length;i++){
      var t=PM_TABLES[i],ids=d.up[t];
      for(var j=0;j<ids.length;j+=200){
        var part=ids.slice(j,j+200);
        await hubWrite('POST','/'+t+'?on_conflict=id',part.map(function(id){
          var r=Object.assign({},cur[t][id]);if(PM_STAMPED[t]){r.updated_by=by;r.updated_at=now}return r;
        }));
        part.forEach(function(id){DB.snap[t][id]=JSON.stringify(cur[t][id])});
      }
    }
    for(var k=PM_TABLES.length-1;k>=0;k--){
      var t2=PM_TABLES[k],del=d.del[t2];
      for(var m=0;m<del.length;m+=50){
        var part2=del.slice(m,m+50);
        await hubWrite('DELETE','/'+t2+'?id=in.('+encodeURIComponent(part2.map(function(id){return '"'+id.replace(/"/g,'\\"')+'"'}).join(','))+')');
        part2.forEach(function(id){delete DB.snap[t2][id]});
      }
    }
  }catch(e){
    ok=false;console.warn('powermap: error al guardar',e);
  }
  DB.busy=false;
  if(ok){setSync('saved')}
  else{setSync('error');DB.retry=setTimeout(persist,6000)}
  if(DB.again)schedulePersist();
}
function schedulePersist(){
  if(DEMO||!DB.loaded||DB.failed)return;
  clearTimeout(DB.timer);
  DB.timer=setTimeout(function(){DB.timer=0;persist()},500);
}
function flushPersist(){if(DB.timer){clearTimeout(DB.timer);DB.timer=0}persist()}
async function refreshFromDb(){
  if(DEMO||!DB.loaded||DB.busy||DB.timer||Date.now()-DB.lastLoad<15000)return;
  if(!modal.hidden)return;
  var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  if(diffRows(dbRows()).n)return;
  if(await dbLoad())refresh();
}
['click','change','keyup','pointerup'].forEach(function(ev){document.addEventListener(ev,schedulePersist,true)});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushPersist();else refreshFromDb()});
window.addEventListener('pagehide',flushPersist);
window.addEventListener('focus',refreshFromDb);

/* ---------- arranque ---------- */
var root=document.documentElement;
var embedded=false;try{embedded=window.self!==window.top}catch(e){embedded=true}
if(embedded)root.classList.add('embedded');
if(!root.dataset.theme){
  var pTheme=null;try{if(embedded)pTheme=window.parent.document.documentElement.getAttribute('data-theme')}catch(e){}
  root.dataset.theme=pTheme||(!embedded&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
}
new MutationObserver(function(){scheduleDraw()}).observe(root,{attributes:true,attributeFilter:['data-theme']});
if(window.ResizeObserver){
  new ResizeObserver(function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(function(){if(!GL.drag&&!GL.moved)globeUpdate(false);else{sizeCanvas();scheduleDraw()}})}).observe($('#stage'));
}
renderStage();renderDash();
loadMap();
if(DEMO){var ds=$('#pmSync');ds.hidden=false;ds.className='pmsync demo';ds.textContent='Modo demo · los cambios no se guardan'}
else{
  $('#loadmsg').hidden=false;
  dbLoad().then(function(){$('#loadmsg').hidden=true;refresh()});
}
})();
